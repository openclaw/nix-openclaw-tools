name: sync-skills

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: maintenance-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs must include updates published by the preceding run.
          ref: main
          persist-credentials: false

      - name: Record source base
        id: source
        run: echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false

      - name: Sync skills from OpenClaw
        run: go run ./cmd/sync-skills

      - name: Check source base before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BASE: ${{ steps.source.outputs.base }}
        run: bash scripts/publish-updates.sh prepare "$SOURCE_BASE"

      - name: Stage skill pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.0.0
        with:
          token: ${{ github.token }}
          branch-token: ${{ github.token }}
          path: .
          base: main
          branch: automation/sync-skills
          add-paths: tools/*/skills/**/SKILL.md
          commit-message: "chore: sync skills from upstream"
          title: "chore: sync skills from upstream"
          body: "Updates vendored skills from upstream. Publication waits for CI on this exact head."
          draft: false

      - name: Validate and merge skill pull request
        if: ${{ steps.pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
          SOURCE_BASE: ${{ steps.source.outputs.base }}
        run: |
          bash scripts/publish-updates.sh "$PR_NUMBER" "$PR_HEAD" "$SOURCE_BASE" automation/sync-skills ':(glob)tools/*/skills/**/SKILL.md'
