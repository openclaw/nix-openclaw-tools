name: update-tools

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maintenance-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Update tool versions and hashes
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/update-tools

      - name: Commit & push if changed
        if: ${{ !cancelled() && (success() || steps.update.outcome == 'failure') }}
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "openclaw-ci"
          git config user.email "ci@openclaw.local"
          git add -A
          git commit -m "chore: update tool releases"
          git push
